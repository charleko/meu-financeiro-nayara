<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Meu Financeiro</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:80px}header{background:white;padding:20px 16px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:2}h1{margin:0;font-size:23px}.sub{color:#707887;font-size:13px}main{max-width:700px;margin:auto;padding:14px}.hero{background:#6c4ce6;color:white;border-radius:20px;padding:18px;margin-bottom:12px}.small{font-size:12px;opacity:.8}.big{font-size:32px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:14px}.label{font-size:12px;color:#707887}.value{font-size:21px;font-weight:800;margin-top:4px}.good{color:#16834b}.bad{color:#c53b3b}.section{font-weight:800;margin:19px 2px 9px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{background:#fff;border:1px solid #e1e4e9;border-radius:14px;padding:14px 9px;font-weight:750;font-size:14px}.primary{background:#6c4ce6;color:#fff;border-color:#6c4ce6}.form{display:none;margin-top:10px}.box{background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;color:#707887;font-size:12px;margin:8px 0 5px}input,select{width:100%;padding:12px;border:1px solid #d7dce4;border-radius:11px;font-size:16px;background:white}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}table{width:100%;border-collapse:collapse;font-size:13px}.wrap{overflow:auto}td,th{padding:9px 5px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.empty{color:#707887;padding:10px}footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e7eb;padding:9px;display:flex;justify-content:center;gap:8px;z-index:3}@media(min-width:600px){.buttons{grid-template-columns:repeat(4,1fr)}} </style></head><body>
<header><h1>Meu Financeiro</h1><div class="sub">Receitas, despesas e contas • simples e privado</div></header><main>
<div class="hero"><div class="small">Saldo do mês</div><div id="bal" class="big">R$ 0,00</div></div><div class="grid"><div class="card"><div class="label">Receitas</div><div id="inc" class="value good">R$ 0,00</div></div><div class="card"><div class="label">Despesas</div><div id="exp" class="value bad">R$ 0,00</div></div></div>
<div class="section">Lançamento rápido</div><div class="buttons"><button class="btn primary" onclick="openF('r')">➕ Receita</button><button class="btn" onclick="openF('e')">➖ Despesa</button><button class="btn" onclick="openF('b')">🧾 Conta</button><button class="btn" onclick="document.getElementById('recent').scrollIntoView({behavior:'smooth'})">📊 Relatório</button></div>
<div id="r" class="form"><div class="box"><b>Nova receita</b><div class="row"><div><label>Data</label><input id="rd" type="date"></div><div><label>Valor</label><input id="rv" type="number" step=".01"></div></div><label>Categoria</label><select id="rc"><option>Salário</option><option>Benefício</option><option>Trabalho extra</option><option>Outros</option></select><label>Descrição</label><input id="rx"><div class="actions"><button class="btn" onclick="closeF()">Cancelar</button><button class="btn primary" onclick="addR()">Salvar</button></div></div></div>
<div id="e" class="form"><div class="box"><b>Nova despesa</b><div class="row"><div><label>Data</label><input id="ed" type="date"></div><div><label>Valor</label><input id="ev" type="number" step=".01"></div></div><label>Categoria</label><select id="ec"><option>Moradia</option><option>Alimentação</option><option>Transporte</option><option>Saúde</option><option>Educação</option><option>Contas</option><option>Compras</option><option>Outros</option></select><label>Descrição</label><input id="ex"><div class="actions"><button class="btn" onclick="closeF()">Cancelar</button><button class="btn primary" onclick="addE()">Salvar</button></div></div></div>
<div id="b" class="form"><div class="box"><b>Conta / compromisso</b><div class="row"><div><label>Vencimento</label><input id="bd" type="date"></div><div><label>Valor</label><input id="bv" type="number" step=".01"></div></div><label>Descrição</label><input id="bx" placeholder="Ex.: aluguel, internet..."><div class="actions"><button class="btn" onclick="closeF()">Cancelar</button><button class="btn primary" onclick="addB()">Salvar</button></div></div></div>
<div class="section">Contas próximas</div><div class="card" id="bills"><div class="empty">Nenhuma conta cadastrada.</div></div>
<div class="section" id="recent">Lançamentos recentes</div><div class="card"><div class="wrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Valor</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main><footer><button class="btn" onclick="backup()">⬇️ Backup</button><button class="btn" onclick="wipe()">🗑️ Limpar</button></footer>
<script>
const K='nayara_fin_v1';let d=JSON.parse(localStorage.getItem(K)||'{"r":[],"e":[],"b":[]}');const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),today=()=>new Date().toISOString().slice(0,10);
function init(){rd.value=ed.value=bd.value=today();render()}function save(){localStorage.setItem(K,JSON.stringify(d));render()}function openF(x){closeF();document.getElementById(x).style.display='block'}function closeF(){document.querySelectorAll('.form').forEach(x=>x.style.display='none')}
function addR(){let x={date:rd.value,v:+rv.value||0,desc:rx.value||rc.value};if(!x.v)return alert('Informe o valor.');d.r.push(x);save();closeF();rv.value=rx.value=''}
function addE(){let x={date:ed.value,v:+ev.value||0,desc:ex.value||ec.value};if(!x.v)return alert('Informe o valor.');d.e.push(x);save();closeF();ev.value=ex.value=''}
function addB(){let x={date:bd.value,v:+bv.value||0,desc:bx.value||'Conta'};if(!x.v)return alert('Informe o valor.');d.b.push(x);save();closeF();bv.value=bx.value=''}
function render(){let m=today().slice(0,7),i=d.r.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+x.v,0),e=d.e.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+x.v,0);inc.textContent=brl(i);exp.textContent=brl(e);bal.textContent=brl(i-e);let all=[...d.r.map(x=>[x.date,'➕',x.desc,x.v]),...d.e.map(x=>[x.date,'➖',x.desc,-x.v])].sort((a,b)=>b[0].localeCompare(a[0]));rows.innerHTML=all.slice(0,25).map(x=>`<tr><td>${x[0].split('-').reverse().join('/')}</td><td>${x[1]}</td><td>${x[2]}</td><td class="${x[3]<0?'bad':'good'}">${brl(x[3])}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhum lançamento.</td></tr>';let bs=d.b.slice().sort((a,b)=>a.date.localeCompare(b.date));bills.innerHTML=bs.length?bs.slice(0,10).map(x=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e5e7eb"><span>${x.desc}<br><small>${x.date.split('-').reverse().join('/')}</small></span><b>${brl(x.v)}</b></div>`).join(''):'<div class="empty">Nenhuma conta cadastrada.</div>'}
function backup(){let z=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(z);a.download='backup-meu-financeiro.json';a.click()}function wipe(){if(confirm('Apagar todos os dados deste aparelho?')){d={r:[],e:[],b:[]};save()}}init();
</script></body></html>
